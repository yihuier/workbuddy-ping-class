name: Release WorkBuddy Agent installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable Agent release
        env:
          WORKBUDDY_PORTABLE_RELEASE: "1"
        run: npm run package:agent

      - name: Create versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release/ping-class-template.html
          release/render_workbuddy_template.py
          release/workbuddy-manifest.json
          release/SHA256SUMS
          --verify-tag
          --title "Ping Class ${GITHUB_REF_NAME}"
          --generate-notes
